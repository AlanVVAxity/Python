[project]
name = "modulo_2"
version = "0.1.0"
description = "Modulo 2 - APIs web con FastAPI"
authors = [
    {name = "Alan Vazquez Velasco"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "fastapi (>=0.115.14,<0.116.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.poetry]
packages = [{ include = "modulo_02", from = "src" }]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
extend_skip = [".venv", "alembic/versions"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["modulo_01"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.52.4" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
