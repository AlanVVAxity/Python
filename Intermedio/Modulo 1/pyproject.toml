[project]
name = "Modulo-01"
version = "0.1.0"
description = "Modulo 1 - Acceso a datos y ORM"
authors = [
    {name = "Alan Vazquez Velasco"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.13,<2.0)"
]

[tool.poetry]
packages = [{ include = "modulo_01", from = "src" }]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
extend_skip = [".venv", "alembic/versions"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["modulo_01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=modulo_01 --cov-report=term-missing"
filterwarnings = [
    "ignore:.*Decimal objects natively.*:sqlalchemy.exc.SAWarning",
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]


[tool.poetry.group.drivers]
optional = true

[tool.poetry.group.drivers.dependencies]
psycopg = { extras = ["binary"], version = ">=3.2,<4.0" }
motor = ">=3.6,<4.0"
