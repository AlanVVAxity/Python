[tool.poetry]
name = "orders-service"
version = "0.1.0"
description = "Servicio de gestión de órdenes con FastAPI y arquitectura limpia."
authors = ["Alan Vazquez Velasco"]
readme = "README.md"
packages = [{ include = "orders_service", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
alembic = "^1.13.0"
pydantic-settings = "^2.4.0"
pyjwt = "^2.9.0"
pwdlib = { extras = ["argon2"], version = "^0.2.0" }
email-validator = "^2.2.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"
pip-audit = "^2.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --cov=orders_service --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["orders_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations"]
